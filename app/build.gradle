plugins {
    id 'com.android.application'
}

android {
    namespace 'app.configfinder'
    compileSdk 34

    defaultConfig {
        applicationId 'app.configfinder'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.1'
        ndk {
            // keeps the APK smaller: phones are arm64 / arm32
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xray core (libv2ray.aar) is downloaded into app/libs by the GitHub workflow.
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
