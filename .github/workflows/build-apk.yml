name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Core logic tests (parsers, Xray config builder, scanners)
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          javac -encoding UTF-8 -d /tmp/out $(find app/src/main/java/app/configfinder/core -name '*.java') core-tests/*.java
          java -cp /tmp/out CoreTest
          java -cp /tmp/out RealDelayTest

      - name: Download Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir app/libs --clobber \
            || gh release download --repo 2dust/AndroidLibXrayLite --pattern '*.aar' --dir app/libs --clobber
          ls -la app/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ConfigFinder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
